<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAINZ Industrial Athletics</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-background">
    <div class="auth-page">
        <div class="auth-inner">
            <header class="auth-branding">
                <div class="auth-logo">
                    <span class="auth-logo-icon"><i class="fas fa-dumbbell"></i></span>
                    <span class="auth-logo-text">GAINZ</span>
                </div>
                <div class="auth-subtitle">INDUSTRIAL ATHLETICS SYSTEM</div>
            </header>

            <section class="auth-card">
                <div class="auth-card-content">
                    <div class="auth-heading">
                        <span>LOGIN</span>
                        <div class="auth-line"></div>
                    </div>

                    <label class="auth-label">Email or Username</label>
                    <div class="auth-field">
                        <input type="text" placeholder="" aria-label="Identity Key">
                        <span class="auth-field-icon"><i class="fas fa-user"></i></span>
                    </div>

                    <label class="auth-label">Password</label>
                    <div class="auth-field">
                        <input type="password" placeholder="" aria-label="Access Code">
                        <span class="auth-field-icon"><i class="fas fa-eye"></i></span>
                    </div>

                    <button type="button" class="auth-button">
                        LOGIN <i class="fas fa-bolt"></i>
                    </button>

                    <div class="auth-actions">
                        <a href="signup.html" class="auth-action-link">NEW RECRUIT? CREATE ACCOUNT</a>
                        <a href="#" class="auth-action-link reset-link"><i class="fas fa-redo"></i> RESET PASSWORD</a>
                    </div>
                </div>
            </section>

            <footer class="auth-footer">
                <div class="auth-footer-note">GAINZ INDUSTRIAL ATHLETICS. NO WEAKNESS.</div>
                <div class="auth-footer-links">
                    <a href="#">TERMS OF SERVICE</a>
                    <a href="#">PRIVACY POLICY</a>
                    <a href="#">SUPPORT</a>
                    <a href="#">API</a>
                </div>
                <div class="auth-footer-copy">© 2024 GAINZ INDUSTRIAL ATHLETICS.</div>
            </footer>
        </div>
    </div>
</body>
</html>
